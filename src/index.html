<!DOCTYPE html>
<html>
<head>
    <title>Ticketmaster Automation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .header {
            margin-bottom: 20px;
        }
        button {
            background-color: #026cdf;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0256b0;
        }
        #status {
            margin-left: 15px;
            color: #666;
        }
        .webview-container {
            flex: 1;
            position: relative;
        }
        #ticketmasterView {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="gotoTicketmaster">Go to Ticketmaster</button>
        <span id="status">Status: Ready</span>
    </div>
    <div class="webview-container">
        <webview id="ticketmasterView" 
                 webpreferences="nodeIntegration=true"
                 useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36"
                 partition="persist:main"
                 allowpopups></webview>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const statusElement = document.getElementById('status');
        const button = document.getElementById('gotoTicketmaster');
        const webview = document.getElementById('ticketmasterView');
        
        // Set additional webview properties
        webview.addEventListener('dom-ready', () => {
            webview.setZoomFactor(1);
            webview.executeJavaScript(`
                Object.defineProperty(navigator, 'webdriver', {
                    get: () => false
                });
            `);
        });

        // Auto-load Ticketmaster when the page loads
        window.addEventListener('load', () => {
            statusElement.textContent = 'Status: Opening Ticketmaster...';
            webview.src = 'https://www.ticketmaster.com';
        });

        // Handle button click
        button.addEventListener('click', async () => {
            try {
                statusElement.textContent = 'Status: Opening Ticketmaster...';
                button.disabled = true;
                
                // Send message to main process
                ipcRenderer.send('goto-ticketmaster');
                
                // Listen for status updates
                ipcRenderer.on('navigation-status', (event, message) => {
                    statusElement.textContent = 'Status: ' + message;
                    if (message.includes('Successfully') || message.includes('Error')) {
                        button.disabled = false;
                    }
                });
            } catch (error) {
                console.error('Error:', error);
                statusElement.textContent = 'Status: Error occurred';
                button.disabled = false;
            }
        });

        // Monitor URL changes
        webview.addEventListener('did-navigate', (event) => {
            const url = event.url;
            if (url.includes('wallet')) {
                ipcRenderer.send('check-wallet-page');
            }
        });
    </script>
</body>
</html>
